name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[net,test]"
      # No local config and no plugins: the public defaults, exactly what a new user gets.
      - run: python -m pytest -q -p no:cacheprovider
        env:
          YOMIBENCH_CONFIG: "-"
